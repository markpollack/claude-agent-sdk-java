name: Publish Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      java-version: '21'
      # Snapshot verification runs the tests. Publishing an artifact that no build
      # proved green is what the release policy forbids.
      skip-tests: false
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
