name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.5.0)'
        required: true
        type: string

jobs:
  release:
    # The one canonical release workflow for this repository.
    uses: markpollack/build-tools/.github/workflows/maven-central-release.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      java-version: '21'
      # Release verification runs the tests. A release is the last place to skip them.
      skip-tests: false
      # ...and running the tests means running the failsafe suite, whose 13 IT classes
      # all drive a real Claude CLI. Without this, release verification fails before it
      # deploys anything. Same install ci.yml uses.
      agent-clis: 'claude'
      # Curated, tracked notes rather than a generated commit list.
      release-notes-file: release-notes/${{ inputs.version }}.md
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
